services:
  db:
    image: postgres:17
    container_name: travel-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: travel
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
